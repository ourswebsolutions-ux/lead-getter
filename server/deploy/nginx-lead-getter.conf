# Add inside the existing `server { ... }` block for
# subscription.axorawebsolutions.com, ABOVE `location / { ... }`, then
#   sudo nginx -t && sudo systemctl reload nginx
#
# /lead-getter/... goes to the Lead Finder licence server (PORT in its .env,
# 8787 by default); everything else stays with the subscription website.
location /lead-getter/ {
    proxy_pass http://127.0.0.1:8787/lead-getter/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Subscription applications carry a payment screenshot (up to 5 MB,
    # base64-encoded); nginx's default 1 MB limit would refuse them.
    client_max_body_size 8m;
}
