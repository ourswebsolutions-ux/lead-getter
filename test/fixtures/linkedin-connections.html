<!doctype html>
<html><head><meta charset="utf-8"><title>LinkedIn</title></head>
<body><main id="main"></main>
<script>
// Built like LinkedIn's pages: My Network > Connections (cards with a
// "Show more results" button), profiles, and the Contact info overlay.
const PEOPLE = {
  'ali-raza': { name: 'Ali Raza', headline: 'CEO at Fit Out Pro', location: 'Dubai, United Arab Emirates', company: 'Fit Out Pro', email: 'ali@fitoutpro.example', phone: '+971 50 123 4567', website: 'https://fitoutpro.example', address: 'Business Bay, Dubai', birthday: 'March 3' },
  'sara-khan': { name: 'Sara Khan', headline: 'Marketing Manager', location: 'Lahore, Pakistan', company: 'Bright Media' },
  'omar-farooq': { name: 'Omar Farooq', headline: 'Founder, BuildCo', location: 'Doha, Qatar', company: 'BuildCo', email: 'omar@buildco.example', website: 'https://buildco.example', phone: '+974 5555 1234', birthday: 'June 5', sdui: true },
  'nina-shah': { name: 'Nina Shah', headline: 'Sales Lead', location: 'Karachi, Pakistan', company: 'SellWell', phone: '0300 1234567' },
  'zain-ali': { name: 'Zain Ali', headline: 'Architect', location: 'Riyadh, Saudi Arabia', company: 'Arc Studio', website: 'https://arcstudio.example', sdui: true },
};
const ORDER = Object.keys(PEOPLE);
const card = (id) => `<li class="mn-connection-card"><a href="/in/${id}/"><span class="mn-connection-card__name">${PEOPLE[id].name}</span></a><span class="mn-connection-card__occupation">${PEOPLE[id].headline}</span><time>Connected 1 week ago</time><button>Message</button></li>`;
const main = document.getElementById('main');
const p = location.pathname;
let m;
if (p.startsWith('/mynetwork/invite-connect/connections')) {
  let shown = 3;
  const draw = () => {
    main.innerHTML = `<section><h1>${ORDER.length} connections</h1><ul>${ORDER.slice(0, shown).map(card).join('')}</ul>${shown < ORDER.length ? '<button id="more">Show more results</button>' : ''}</section>`;
    const b = document.getElementById('more');
    if (b) b.onclick = () => { shown += 2; draw(); };
  };
  draw();
} else if ((m = p.match(/^\/in\/([^/]+)/))) {
  // A profile. Its "Contact info" link (next to the location) opens the
  // popup when clicked; opening the popup's address directly shows the
  // profile only, as LinkedIn's current site does. "More" opens a menu.
  const id = m[1];
  const x = PEOPLE[id];
  document.title = `${x.name} | LinkedIn`;
  const link = x.sdui ? `<button type="button" class="ci-link">Contact info</button>` : `<a id="top-card-text-details-contact-info" href="/in/${id}/overlay/contact-info/">Contact info</a>`;
  main.innerHTML = `<section class="artdeco-card pv-top-card"><div><h1 class="text-heading-xlarge">${x.name}</h1><span>· 1st</span></div>
    <div class="text-body-medium break-words">${x.headline}</div>
    <div><span class="text-body-small inline t-black--light break-words">${x.location}</span> · ${link}</div>
    <ul><li><a href="/company/${x.company.toLowerCase().replace(/\s+/g, '-')}/"><span>${x.company}</span></a></li></ul>
    <div><button type="button">Message</button><button type="button" id="more">More</button></div></section>
    <section><h2>About</h2><p>For press write to <a href="mailto:press@background.example">press@background.example</a></p></section>
    <section><h2>Experience</h2><ul><li><span>${x.headline.split(' at ')[0]}</span><span>${x.company}</span></li></ul></section>
    <aside role="dialog" aria-label="Messaging" class="msg-overlay"><h2>Messaging</h2><a href="mailto:inbox@messaging.example">inbox</a><p>Phone 0300 9999999</p></aside>`;
  window.contactClicks = 0;
  document.getElementById('more').onclick = () => main.insertAdjacentHTML('beforeend', '<div role="dialog" class="more-menu"><a href="mailto:share@more.example">Share profile</a><p>Save to PDF</p></div>');
  const opener = main.querySelector('#top-card-text-details-contact-info, .ci-link');
  opener.addEventListener('click', (e) => {
    e.preventDefault();
    window.contactClicks++;
    openPopup(id);
  });
}
function openPopup(id) {
  const x = PEOPLE[id];
  main.insertAdjacentHTML('beforeend', `<div role="dialog" class="artdeco-modal" aria-labelledby="ci"><h2 id="ci">Contact info</h2><div id="body"></div><button aria-label="Dismiss" id="dismiss">Dismiss</button></div>`);
  document.getElementById('dismiss').onclick = () => document.querySelector('.artdeco-modal')?.remove();
  const body = document.getElementById('body');
  const row = (label, inner) => `<div class="ci-row"><p class="ci-label"><svg></svg>${label}</p><div>${inner}</div></div>`;
  setTimeout(() => {
    if (x.sdui) {
      body.innerHTML = [
        row(`${x.name}’s Profile`, `<a href="https://www.linkedin.com/in/${id}">linkedin.com/in/${id}</a>`),
        x.website ? row('Website', `<a href="https://www.linkedin.com/redir/redirect?url=${encodeURIComponent(x.website)}&urlhash=x">${x.website.replace('https://', '')}</a><span> (Company)</span>`) : '',
        x.phone ? row('Phone', `<span>${x.phone}</span><span> (Mobile)</span>`) : '',
        x.email ? row('Email', `<a href="mailto:${x.email}">${x.email}</a>`) : '',
        x.birthday ? row('Birthday', `<span>${x.birthday}</span>`) : '',
        row('Connected', '<span>Nov 10, 2026</span>'),
      ].join('');
    } else {
      body.innerHTML = `<section class="pv-contact-info__contact-type"><h3>${x.name}’s Profile</h3><a href="https://www.linkedin.com/in/${id}">linkedin.com/in/${id}</a></section>
        ${x.website ? `<section class="pv-contact-info__contact-type"><h3>Website</h3><a href="${x.website}">${x.website.replace('https://', '')}</a></section>` : ''}
        ${x.phone ? `<section class="pv-contact-info__contact-type"><h3>Phone</h3><ul><li><span class="t-14">${x.phone}</span> (Mobile)</li></ul></section>` : ''}
        ${x.address ? `<section class="pv-contact-info__contact-type"><h3>Address</h3><a href="https://maps.example">${x.address}</a></section>` : ''}
        ${x.email ? `<section class="pv-contact-info__contact-type"><h3>Email</h3><a href="mailto:${x.email}">${x.email}</a></section>` : ''}
        ${x.birthday ? `<section class="pv-contact-info__contact-type"><h3>Birthday</h3><span>${x.birthday}</span></section>` : ''}
        <section class="pv-contact-info__contact-type"><h3>Connected</h3><span>Nov 10, 2026</span></section>`;
    }
  }, 700);
}
</script></body></html>
